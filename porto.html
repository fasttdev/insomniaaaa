<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portofolio — Insomnia Dev</title>
<link rel="icon" href="logo.jpg" type="image/jpeg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --blue-50:  #f0f8ff;
    --blue-100: #e0f2fe;
    --blue-200: #bae6fd;
    --blue-300: #7dd3fc;
    --blue-400: #38bdf8;
    --blue-500: #0ea5e9;
    --blue-600: #0284c7;
    --blue-700: #0369a1;
    --blue-800: #075985;
    --blue-900: #0c4a6e;
    --ink:      #0b1220;
    --ink-2:    #334155;
    --muted:    #64748b;
    --line:     #e3eef8;
  }

  body {
    font-family: "Segoe UI", system-ui, Arial, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(700px 400px at 85% 0%, var(--blue-100) 0%, transparent 60%),
      radial-gradient(600px 380px at 0% 100%, var(--blue-50) 0%, transparent 60%),
      #fbfdff;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    background: #fff;
    border-bottom: 1px solid var(--line);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
  }
  .brand img {
    width: 42px; height: 42px;
    border-radius: 10px;
    object-fit: cover;
    border: 1px solid var(--line);
  }
  .brand b { font-size: 16px; font-weight: 800; letter-spacing: -.3px; }
  .brand b em { font-style: normal; color: var(--blue-500); }

  .back {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-2);
    text-decoration: none;
    background: #fff;
    border: 1px solid var(--line);
    padding: 9px 16px;
    border-radius: 99px;
    transition: color .15s, border-color .15s;
  }
  .back:hover { color: var(--blue-600); border-color: var(--blue-200); }

  /* MAIN */
  main {
    flex: 1;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 24px 56px;
  }

  .intro { text-align: center; margin-bottom: 8px; }

  .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    color: var(--blue-600);
    background: var(--blue-100);
    padding: 6px 14px;
    border-radius: 99px;
    margin-bottom: 16px;
  }

  h1 {
    font-size: clamp(28px, 5vw, 42px);
    line-height: 1.1;
    letter-spacing: -1.2px;
    margin-bottom: 12px;
  }
  h1 em {
    font-style: normal;
    background: linear-gradient(90deg, var(--blue-500), var(--blue-300));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .desc {
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--ink-2);
    max-width: 48ch;
    margin: 0 auto;
  }

  /* ========== SCENE ========== */
  .scene {
    position: relative;
    width: 100%;
    height: 620px;
    margin-top: 8px;
    overflow: visible;
  }

  .svg-strap {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
    z-index: 1;
  }

  /* anchor titik gantung */
  .anchor {
    position: absolute;
    top: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, #ffffff 0%, #e2e8f0 30%, #94a3b8 70%, #475569 100%);
    box-shadow:
      0 6px 14px rgba(2, 50, 80, .35),
      inset 0 -3px 4px rgba(0, 0, 0, .35),
      inset 0 3px 4px rgba(255, 255, 255, .95);
    z-index: 3;
  }
  .anchor::after {
    content: "";
    position: absolute;
    inset: 9px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #cbd5e1, #475569);
    box-shadow:
      inset 0 2px 3px rgba(0, 0, 0, .4),
      0 1px 0 rgba(255, 255, 255, .6);
  }

  /* ========== KARTU ID (versi baru) ========== */
  .idcard {
    position: absolute;
    top: 0; left: 0;
    width: 282px;
    background: #ffffff;
    border-radius: 20px;
    box-shadow:
      0 30px 60px -28px rgba(2, 132, 199, .45),
      0 4px 12px -4px rgba(2, 132, 199, .15);
    padding: 0 0 16px;
    z-index: 2;
    transform-origin: 50% 21px;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    will-change: transform;
    backface-visibility: hidden;
    overflow: hidden;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(14,165,233,.07) 1px, transparent 0);
    background-size: 12px 12px;
  }
  .idcard:active { cursor: grabbing; }

  /* accent bar atas */
  .idcard__bar {
    height: 6px;
    background: linear-gradient(90deg, var(--blue-400), var(--blue-600), var(--blue-400));
  }

  /* slot/lubang lanyard */
  .idcard__hole {
    width: 52px;
    height: 10px;
    margin: 9px auto 12px;
    border-radius: 99px;
    background:
      linear-gradient(180deg, #64748b 0%, #334155 45%, #1e293b 100%);
    box-shadow:
      inset 0 2px 3px rgba(0, 0, 0, .55),
      inset 0 -1px 1px rgba(255, 255, 255, .25),
      0 1px 0 rgba(255, 255, 255, .8);
    position: relative;
  }
  .idcard__hole::after {
    content: "";
    position: absolute;
    inset: 2px 3px;
    border-radius: 99px;
    background: #0b1220;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, .8);
  }

  /* header ID */
  .idcard__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    margin-bottom: 12px;
  }
  .idcard__brand {
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: .18em;
    color: var(--muted);
  }
  .idcard__status {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .1em;
    color: var(--blue-700);
    background: var(--blue-50);
    border: 1px solid var(--blue-100);
    padding: 3px 8px;
    border-radius: 99px;
  }
  .idcard__status i {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--blue-500);
  }

  /* foto + ring */
  .idcard__photo-wrap {
    width: 108px;
    height: 132px;
    margin: 0 auto 12px;
    position: relative;
  }
  .idcard__photo-wrap::before {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--blue-300), var(--blue-500), var(--blue-300));
    z-index: 0;
  }
  .idcard__photo-wrap::after {
    content: "";
    position: absolute;
    inset: -7px;
    border-radius: 20px;
    border: 1px dashed var(--blue-200);
    z-index: 0;
  }
  .idcard__photo {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 14px;
    overflow: hidden;
    background: var(--blue-50);
    z-index: 1;
    box-shadow: 0 8px 18px -8px rgba(2, 132, 199, .5);
  }
  .idcard__photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  /* nama + role */
  .idcard__name {
    text-align: center;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -.5px;
    padding: 0 16px;
    background: linear-gradient(90deg, var(--ink) 0%, var(--blue-700) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .idcard__role {
    text-align: center;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .06em;
    color: var(--blue-600);
    text-transform: uppercase;
    margin-top: 4px;
    margin-bottom: 14px;
  }

  /* divider */
  .idcard__divider {
    height: 1px;
    margin: 0 16px 12px;
    background:
      linear-gradient(90deg, transparent, var(--line) 20%, var(--line) 80%, transparent);
  }

  /* baris info */
  .idcard__rows {
    list-style: none;
    padding: 0 16px;
  }
  .idcard__rows li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 5.5px 0;
    font-size: 11.5px;
  }
  .idcard__rows li + li {
    border-top: 1px solid #f1f7fd;
  }
  .idcard__rows dt {
    color: var(--muted);
    font-weight: 600;
    flex-shrink: 0;
  }
  .idcard__rows dd {
    color: var(--ink);
    font-weight: 700;
    text-align: right;
  }
  .idcard__rows dd b {
    color: var(--blue-600);
  }

  /* footer barcode */
  .idcard__footer {
    padding: 14px 16px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .idcard__code {
    font-family: Consolas, monospace;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .12em;
    color: var(--muted);
  }
  .idcard__barcode {
    height: 22px;
    width: 100px;
    background:
      repeating-linear-gradient(
        90deg,
        var(--ink) 0px, var(--ink) 2px,
        transparent 2px, transparent 4px,
        var(--ink) 4px, var(--ink) 5px,
        transparent 5px, transparent 7px,
        var(--ink) 7px, var(--ink) 10px,
        transparent 10px, transparent 12px,
        var(--ink) 12px, var(--ink) 13px,
        transparent 13px, transparent 16px
      );
    border-radius: 2px;
    opacity: .85;
  }

  /* hint */
  .hint-wrap { text-align: center; margin-top: 14px; }
  .hint {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    background: #fff;
    border: 1px solid var(--line);
    padding: 7px 16px;
    border-radius: 99px;
  }
  .hint svg { color: var(--blue-500); }

  /* chips */
  .chips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 26px;
  }
  .chips span {
    font-size: 12px;
    font-weight: 700;
    color: var(--blue-600);
    background: #fff;
    border: 1px solid var(--blue-100);
    padding: 7px 14px;
    border-radius: 99px;
  }

  /* about */
  .about {
    margin-top: 28px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .about__card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    transition: border-color .15s, transform .15s;
  }
  .about__card:hover {
    border-color: var(--blue-200);
    transform: translateY(-2px);
  }
  .about__card h3 {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--blue-600);
    margin-bottom: 7px;
  }
  .about__card p {
    font-size: 13px;
    line-height: 1.65;
    color: var(--ink-2);
  }

  /* footer */
  footer {
    background: #fff;
    border-top: 1px solid var(--line);
    padding: 26px;
    text-align: center;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--blue-400), var(--blue-600));
    padding: 14px 34px;
    border: none;
    border-radius: 99px;
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 10px 24px -10px rgba(2, 132, 199, .6);
    transition: background .15s, transform .15s, box-shadow .15s;
  }
  .btn:hover {
    background: var(--blue-600);
    transform: translateY(-2px);
    box-shadow: 0 16px 30px -12px rgba(2, 132, 199, .65);
  }
  footer small {
    display: block;
    margin-top: 14px;
    font-size: 12px;
    color: var(--muted);
  }

  @media (max-width: 640px) {
    main { padding: 22px 16px 44px; }
    .scene { height: 560px; }
    .about { grid-template-columns: 1fr; }
    .btn { width: 100%; justify-content: center; }
  }
  @media (max-width: 400px) {
    .idcard { width: 252px; }
    .idcard__photo-wrap { width: 96px; height: 118px; }
    .idcard__name { font-size: 17px; }
    .idcard__rows li { font-size: 11px; }
  }
</style>
</head>
<body>

<header>
  <a class="brand" href="index.html">
    <img src="logo.jpg" alt="Logo Insomnia Dev">
    <b>Insomnia<em>Dev</em></b>
  </a>
  <a class="back" href="index.html">&larr; Landing</a>
</header>

<main>
  <section class="intro">
    <div class="badge">Portofolio</div>
    <h1>Halo, saya<br><em>Insomnia Dev.</em></h1>
    <p class="desc">
      Nama asli <strong>Yudha</strong>. Tinggal di Dlingo, Bantul, Yogyakarta.
      Sehari-hari ngoding web, IoT, dan Arduino — sudah <strong>65+ project</strong>.
    </p>
  </section>

  <!-- SCENE -->
  <section class="scene" id="scene">

    <svg class="svg-strap" id="svgStrap" xmlns="http://www.w3
