<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VT Search — Insomnia Dev</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="stylesheet" href="beranda.css">
<link rel="stylesheet" href="tools.css">
<link rel="stylesheet" href="vtsearch.css">
</head>
<body class="is-loading">

<div class="xfer" aria-hidden="true">
  <div class="xfer__half xfer__half--top"></div>
  <div class="xfer__half xfer__half--bot"></div>
  <div class="xfer__seam"></div>
  <div class="xfer__brand">
    <img src="logo.png" alt="">
    <span>Insomnia<em>Dev</em></span>
  </div>
</div>

<div class="bg" aria-hidden="true">
  <div class="bg__grid"></div>
</div>

<header class="nav reveal" style="--d:80ms">
  <a class="nav__brand" href="beranda.html" data-nav>
    <img src="logo.png" alt="Logo Insomnia Dev">
    <b>Insomnia<em>Dev</em></b>
  </a>
  <nav class="nav__links" id="navViewport" aria-label="Navigasi utama">
    <div class="nav__track" id="navTrack">
      <a href="beranda.html" class="nav__link" data-nav>Beranda</a>
      <a href="tools.html" class="nav__link is-active" data-nav>Tools</a>
      <a href="req.html" class="nav__link" data-nav>Req</a>
      <a href="info.html" class="nav__link" data-nav>Information</a>
    </div>
  </nav>
</header>

<main class="page">

  <section class="hero reveal" style="--d:160ms">
    <div class="hero__badge"><i></i> Tools · VT Search</div>
    <h1 class="hero__title">
      Cari video TikTok<br><em>tanpa batas.</em>
    </h1>
    <p class="hero__desc">
      Temukan video TikTok berdasarkan kata kunci. Putar langsung
      atau unduh videonya tanpa watermark.
    </p>
  </section>

  <section class="vts reveal" style="--d:240ms" aria-labelledby="vtsTitle">
    <div class="vts__head">
      <div class="vts__mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
      </div>
      <div>
        <div class="vts__kicker">TikTok Video Search</div>
        <h2 class="vts__title" id="vtsTitle">Pencarian <em>Video</em></h2>
      </div>
    </div>

    <form class="vts__form" id="vtsForm" novalidate>
      <div class="vts__control" id="vtsWrap">
        <svg class="vts__control-icon" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="text" class="vts__input" id="vtsQuery"
               placeholder="Kata kunci pencarian (contoh: supra mk4)"
               autocomplete="off" spellcheck="false"
               aria-label="Kata kunci pencarian">
      </div>
      <button type="submit" class="vts__submit" id="vtsSubmit">
        <span class="vts__submit-label">Cari Video</span>
        <span class="vts__spinner" id="vtsSpinner" hidden></span>
      </button>
    </form>

    <div class="vts__status" id="vtsStatus" role="status" aria-live="polite" hidden></div>

    <div class="vts__grid" id="vtsResult"></div>
  </section>

</main>

<footer class="foot reveal" style="--d:320ms">
  &copy; <span id="y">2025</span> <span>Insomnia Dev</span>. Semua hak dilindungi.
</footer>

<script src="app.js" defer></script>

<script>
(function () {
  "use strict";

  function initVts() {
    var form = document.getElementById("vtsForm");
    if (!form) return;

    var yearEl = document.getElementById("y");
    if (yearEl) yearEl.textContent = new Date().getFullYear();

    var input    = document.getElementById("vtsQuery");
    var wrap     = document.getElementById("vtsWrap");
    var submit   = document.getElementById("vtsSubmit");
    var spinner  = document.getElementById("vtsSpinner");
    var label    = submit.querySelector(".vts__submit-label");
    var statusEl = document.getElementById("vtsStatus");
    var resultEl = document.getElementById("vtsResult");

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    var ICONS = {
      loading: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.2-8.5"/></svg>',
      error:   '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>',
      success: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
      info:    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>'
    };

    function showStatus(text, type) {
      statusEl.className = "vts__status is-" + (type || "info");
      statusEl.innerHTML = (ICONS[type] || ICONS.info) + "<span>" + escapeHtml(text) + "</span>";
      statusEl.hidden = false;
    }
    function hideStatus() {
      statusEl.hidden = true;
      statusEl.innerHTML = "";
    }

    function renderResults(data) {
      resultEl.innerHTML = "";
      if (!data || !data.data || data.data.length === 0) {
        resultEl.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--muted);font-size:13.5px;">Tidak ada video yang ditemukan.</div>';
        return;
      }

      var html = "";
      for (var i = 0; i < data.data.length; i++) {
        var v = data.data[i];
        html += '<div class="vcard">';
        
        // Thumbnail
        html += '<a href="' + escapeHtml(v.play_url) + '" target="_blank" rel="noopener noreferrer" class="vcard__thumb">';
        if (v.cover_url) {
          html += '<img src="' + escapeHtml(v.cover_url) + '" alt="" loading="lazy" referrerpolicy="no-referrer">';
        }
        html += '<div class="vcard__play">';
        html += '<div class="vcard__play-icon">';
        html += '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
        html += '</div>';
        html += '</div>';
        if (v.duration) {
          html += '<span class="vcard__duration">' + escapeHtml(v.duration) + '</span>';
        }
        html += '</a>';

        // Info
        html += '<div class="vcard__info">';
        html += '<div class="vcard__title">' + escapeHtml(v.title) + '</div>';
        html += '<div class="vcard__date">' + escapeHtml(v.created_at) + '</div>';
        html += '</div>';

        // Actions
        html += '<div class="vcard__actions">';
        html += '<a href="' + escapeHtml(v.play_url) + '" target="_blank" rel="noopener noreferrer" class="vcard__btn vcard__btn--play">';
        html += '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
        html += '<span>Putar</span>';
        html += '</a>';
        html += '<a href="' + escapeHtml(v.play_url) + '" download target="_blank" rel="noopener noreferrer" class="vcard__btn vcard__btn--dl">';
        html += '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>';
        html += '<span>Unduh</span>';
        html += '</a>';
        html += '</div>';

        html += '</div>';
      }
      resultEl.innerHTML = html;
    }

    input.addEventListener("input", function () {
      wrap.classList.remove("is-invalid");
    });

    form.addEventListener("submit", async function (ev) {
      ev.preventDefault();

      var query = input.value.trim();
      if (!query) {
        wrap.classList.add("is-invalid");
        showStatus("Masukkan kata kunci pencarian.", "error");
        input.focus();
        return;
      }

      resultEl.innerHTML = "";
      submit.disabled = true;
      input.disabled = true;
      spinner.hidden = false;
      label.textContent = "Mencari";

      showStatus("Mencari video TikTok, mohon tunggu…", "loading");

      var timers = [];
      var msgs = [
        [5000,  "Menginisialisasi session…"],
        [10000, "Mengambil hasil pencarian…"],
        [20000, "Hampir selesai…"]
      ];
      for (var i = 0; i < msgs.length; i++) {
        (function (delay, text) {
          timers.push(setTimeout(function () { showStatus(text, "loading"); }, delay));
        })(msgs[i][0], msgs[i][1]);
      }

      try {
        var controller = new AbortController();
        var timeoutId = setTimeout(function () { controller.abort(); }, 60000);

        var res = await fetch("/api/vtsearch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: query }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        var json;
        try { json = await res.json(); }
        catch (e) { throw new Error("Server mengembalikan respons tidak valid."); }

        if (!json.ok) throw new Error(json.error || "Gagal mencari video.");

        hideStatus();
        showStatus("Ditemukan " + json.data.total_results + " video.", "success");
        renderResults(json.data);
      } catch (err) {
        if (err.name === "AbortError") {
          showStatus("Waktu habis. Server tidak merespons.", "error");
        } else {
          showStatus(err.message || "Terjadi kesalahan.", "error");
        }
      } finally {
        for (var t = 0; t < timers.length; t++) clearTimeout(timers[t]);
        submit.disabled = false;
        input.disabled = false;
        spinner.hidden = true;
        label.textContent = "Cari Video";
      }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initVts);
  } else {
    initVts();
  }
})();
</script>

</body>
</html>
