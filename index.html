<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insomnia Dev</title>
<link rel="icon" href="logo.jpg" type="image/jpeg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", system-ui, Arial, sans-serif;
    background: #f5faff;
    color: #0b1220;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: #fff;
    border-bottom: 1px solid #e3eef8;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
  }
  .brand img {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    object-fit: cover;
    border: 1px solid #e3eef8;
  }
  .brand span { font-weight: 700; font-size: 16px; }
  .brand span b { color: #0ea5e9; }

  header small { font-size: 12px; color: #64748b; }

  /* MAIN */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  .hero {
    max-width: 560px;
    text-align: center;
  }

  .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    color: #0284c7;
    background: #e0f2fe;
    border: 1px solid #bae6fd;
    padding: 5px 12px;
    border-radius: 99px;
    margin-bottom: 18px;
  }

  h1 {
    font-size: clamp(30px, 6vw, 48px);
    line-height: 1.1;
    letter-spacing: -1px;
    margin-bottom: 16px;
  }
  h1 em { font-style: normal; color: #0ea5e9; }

  p.desc {
    font-size: 15px;
    line-height: 1.7;
    color: #334155;
    margin-bottom: 28px;
  }

  /* BUTTON */
  .btn {
    display: inline-block;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    background: #0ea5e9;
    padding: 13px 36px;
    border-radius: 99px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: background .15s;
  }
  .btn:hover { background: #0284c7; }
  .btn:active { background: #0369a1; }

  /* FOOTER */
  footer {
    text-align: center;
    font-size: 12px;
    color: #64748b;
    padding: 16px;
    border-top: 1px solid #e3eef8;
    background: #fff;
  }

  @media (max-width: 480px) {
    header { padding: 12px 16px; }
    header small { display: none; }
    .brand img { width: 34px; height: 34px; }
    main { padding: 28px 18px; }
    .btn { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <a class="brand" href="index.html">
    <img src="logo.jpg" alt="Logo Insomnia Dev">
    <span>Insomnia<b>Dev</b></span>
  </a>
  <small>Build · Ship · Repeat</small>
</header>

<main>
  <section class="hero">
    <div class="badge">Selamat datang di Insomnia Dev</div>
    <h1>Ide lahir saat<br>dunia <em>tertidur.</em></h1>
    <p class="desc">
      Tempat baris kode disusun, masalah diurai, dan produk dirilis —
      biasanya saat jam sudah lewat tengah malam.
    </p>
    <a class="btn" href="beranda.html">Mulai</a>
  </section>
</main>

<footer>
  &copy; <span id="y">2025</span> Insomnia Dev. Semua hak dilindungi.
</footer>

<script>
  document.getElementById("y").textContent = new Date().getFullYear();
</script>

</body>
</html>
