<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play Store — Insomnia Dev</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="stylesheet" href="beranda.css">
<link rel="stylesheet" href="tools.css">
<link rel="stylesheet" href="playstore.css">
</head>
<body class="is-loading">

<div class="xfer" aria-hidden="true">
  <div class="xfer__half xfer__half--top"></div>
  <div class="xfer__half xfer__half--bot"></div>
  <div class="xfer__seam"></div>
  <div class="xfer__brand">
    <img src="logo.png" alt="">
    <span>Insomnia<em>Dev</em></span>
  </div>
</div>

<div class="bg" aria-hidden="true">
  <div class="bg__grid"></div>
</div>

<header class="nav reveal" style="--d:80ms">
  <a class="nav__brand" href="beranda.html" data-nav>
    <img src="logo.png" alt="Logo Insomnia Dev">
    <b>Insomnia<em>Dev</em></b>
  </a>
  <nav class="nav__links" id="navViewport" aria-label="Navigasi utama">
    <div class="nav__track" id="navTrack">
      <a href="beranda.html" class="nav__link" data-nav>Beranda</a>
      <a href="tools.html" class="nav__link is-active" data-nav>Tools</a>
      <a href="req.html" class="nav__link" data-nav>Req</a>
      <a href="info.html" class="nav__link" data-nav>Information</a>
    </div>
  </nav>
</header>

<main class="page">

  <section class="hero reveal" style="--d:160ms">
    <div class="hero__badge"><i></i> Tools · Play Store</div>
    <h1 class="hero__title">
      Jelajahi<br><em>Play Store.</em>
    </h1>
    <p class="hero__desc">
      Cari aplikasi atau lihat detail aplikasi lengkap langsung dari Google Play Store.
    </p>
  </section>

  <section class="pstore reveal" style="--d:240ms">
    <div class="pstore__head">
      <div class="pstore__mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3.6 1.5c-.4.2-.6.6-.6 1.1v18.8c0 .5.2.9.6 1.1l10.6-10.5L3.6 1.5zm11.7 9.4l2.9-2.9-13-7.4c-.1-.1-.3-.1-.4-.2l10.5 10.5zm0 2.2L4.8 23.6c.1 0 .3-.1.4-.2l13-7.4-2.9-2.9zm3.6-1.1l3.5-2c.8-.4.8-1.6 0-2l-3.5-2-3.2 3.1 3.2 2.9z"/>
        </svg>
      </div>
      <div>
        <div class="pstore__kicker">Google Play Store</div>
        <h2 class="pstore__title">App Scraper</h2>
      </div>
    </div>

    <div class="pstore__tabs">
      <div class="pstore__tab is-active" id="tabSearch">Cari Aplikasi</div>
      <div class="pstore__tab" id="tabDetail">Detail via Link</div>
    </div>

    <form class="pstore__form" id="pstoreForm" novalidate>
      <div class="pstore__control" id="pstoreControl">
        <svg class="pstore__control-icon" id="pstoreIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="text" class="pstore__input" id="pstoreInput"
               placeholder="Kata kunci pencarian (contoh: whatsapp)"
               autocomplete="off" spellcheck="false">
      </div>
      <button type="submit" class="pstore__submit" id="pstoreSubmit">
        <span class="pstore__submit-label">Cari</span>
        <span class="pstore__spinner" id="pstoreSpinner" hidden></span>
      </button>
    </form>

    <div class="pstore__status" id="pstoreStatus" role="status" aria-live="polite" hidden></div>

    <!-- Results -->
    <div class="pstore__grid" id="pstoreGrid"></div>
    <div class="pdet" id="pstoreDetail" hidden></div>

  </section>

</main>

<footer class="foot reveal" style="--d:320ms">
  &copy; <span id="y">2025</span> <span>Insomnia Dev</span>. Semua hak dilindungi.
</footer>

<script src="app.js" defer></script>

<script>
(function () {
  "use strict";

  function initPstore() {
    var form = document.getElementById("pstoreForm");
    if (!form) return;

    var yearEl = document.getElementById("y");
    if (yearEl) yearEl.textContent = new Date().getFullYear();

    var tabSearch = document.getElementById("tabSearch");
    var tabDetail = document.getElementById("tabDetail");
    var input = document.getElementById("pstoreInput");
    var control = document.getElementById("pstoreControl");
    var submit = document.getElementById("pstoreSubmit");
    var spinner = document.getElementById("pstoreSpinner");
    var label = submit.querySelector(".pstore__submit-label");
    var statusEl = document.getElementById("pstoreStatus");
    var gridEl = document.getElementById("pstoreGrid");
    var detailEl = document.getElementById("pstoreDetail");
    var inputIcon = document.getElementById("pstoreIcon");

    var mode = "search"; // 'search' | 'detail'

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    var ICONS = {
      loading: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.2-8.5"/></svg>',
      error:   '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>',
      success: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
      info:    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>'
    };

    function showStatus(text, type) {
      statusEl.className = "pstore__status is-" + (type || "info");
      statusEl.innerHTML = (ICONS[type] || ICONS.info) + "<span>" + escapeHtml(text) + "</span>";
      statusEl.hidden = false;
    }
    function hideStatus() {
      statusEl.hidden = true;
      statusEl.innerHTML = "";
    }

    // --- Tabs Logic ---
    tabSearch.addEventListener("click", function() {
      mode = "search";
      tabSearch.classList.add("is-active");
      tabDetail.classList.remove("is-active");
      input.placeholder = "Kata kunci pencarian (contoh: whatsapp)";
      inputIcon.innerHTML = '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>';
      label.textContent = "Cari";
      input.value = "";
      gridEl.innerHTML = "";
      detailEl.hidden = true;
      hideStatus();
    });

    tabDetail.addEventListener("click", function() {
      mode = "detail";
      tabDetail.classList.add("is-active");
      tabSearch.classList.remove("is-active");
      input.placeholder = "https://play.google.com/store/apps/details?id=...";
      inputIcon.innerHTML = '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>';
      label.textContent = "Lihat";
      input.value = "";
      gridEl.innerHTML = "";
      detailEl.hidden = true;
      hideStatus();
    });

    input.addEventListener("input", function () {
      control.classList.remove("is-invalid");
    });

    // --- Render Functions ---
    function renderSearchResults(apps) {
      gridEl.innerHTML = "";
      if (!apps || apps.length === 0) {
        gridEl.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--muted);font-size:13.5px;">Tidak ada aplikasi ditemukan.</div>';
        return;
      }

      var html = "";
      for (var i = 0; i < apps.length; i++) {
        var v = apps[i];
        html += '<div class="papp" onclick="window.__pstoreLoadDetail(\'' + escapeHtml(v.appId) + '\')">';
        html += '<img class="papp__icon" src="' + escapeHtml(v.icon) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">';
        html += '<div class="papp__info">';
        html += '<div class="papp__title">' + escapeHtml(v.title) + '</div>';
        html += '<div class="papp__dev">' + escapeHtml(v.developer.name) + '</div>';
        html += '<div class="papp__meta">';
        html += '<span><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg> ' + escapeHtml(v.scoreText) + '</span>';
        html += '<span>' + escapeHtml(v.installs) + '</span>';
        html += '</div>';
        html += '</div>';
        html += '</div>';
      }
      gridEl.innerHTML = html;
    }

    function renderDetail(app) {
      var html = "";

      html += '<div class="pdet__header">';
      if (app.headerImage) {
        html += '<img src="' + escapeHtml(app.headerImage) + '" alt="" onerror="this.style.display=\'none\'">';
      }
      html += '</div>';

      html += '<div class="pdet__head-content">';
      html += '<img class="pdet__icon" src="' + escapeHtml(app.icon) + '" alt="">';
      html += '<div class="pdet__title-wrap">';
      html += '<div class="pdet__title">' + escapeHtml(app.title) + '</div>';
      html += '<div class="pdet__dev">' + escapeHtml(app.developer.name) + '</div>';
      html += '</div>';
      html += '</div>';

      html += '<div class="pdet__stats">';
      html += '<div class="pdet__stat"><b>' + escapeHtml(app.scoreText) + '</b><span>Rating</span></div>';
      html += '<div class="pdet__stat"><b>' + escapeHtml(app.installs) + '</b><span>Instal</span></div>';
      html += '<div class="pdet__stat"><b>' + escapeHtml(app.size || '-') + '</b><span>Ukuran</span></div>';
      html += '<div class="pdet__stat"><b>' + escapeHtml(app.priceText) + '</b><span>Harga</span></div>';
      html += '</div>';

      html += '<div class="pdet__body">';
      html += '<div class="pdet__desc-title">Tentang Aplikasi</div>';
      html += '<div class="pdet__desc">' + escapeHtml(app.description || 'Tidak ada deskripsi.') + '</div>';

      html += '<div class="pdet__links">';
      html += '<a href="' + escapeHtml(app.links.playStore) + '" target="_blank" rel="noopener noreferrer" class="pdet__link pdet__link--play">Buka di Play Store</a>';
      html += '<a href="' + escapeHtml(app.links.apkCombo) + '" target="_blank" rel="noopener noreferrer" class="pdet__link pdet__link--apk">Download APK</a>';
      html += '</div>';

      html += '</div>';

      detailEl.innerHTML = html;
      detailEl.hidden = false;
      detailEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    // --- Global function for card click ---
    window.__pstoreLoadDetail = function(appId) {
      input.value = appId;
      mode = "detail";
      tabDetail.click();
      form.dispatchEvent(new Event("submit"));
    };

    // --- Submit ---
    form.addEventListener("submit", async function (ev) {
      ev.preventDefault();

      var val = input.value.trim();
      if (!val) {
        control.classList.add("is-invalid");
        showStatus(mode === "search" ? "Masukkan kata kunci." : "Masukkan link/ID aplikasi.", "error");
        input.focus();
        return;
      }

      gridEl.innerHTML = "";
      detailEl.hidden = true;
      submit.disabled = true;
      input.disabled = true;
      spinner.hidden = false;
      label.textContent = "Memproses";

      showStatus(mode === "search" ? "Mencari di Play Store..." : "Mengambil detail aplikasi...", "loading");

      try {
        var controller = new AbortController();
        var timeoutId = setTimeout(function () { controller.abort(); }, 30000);

        var payload = mode === "search" ? { action: "search", query: val } : { action: "detail", appId: val };

        var res = await fetch("/api/playstore", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        var json;
        try { json = await res.json(); }
        catch (e) { throw new Error("Server mengembalikan respons tidak valid."); }

        if (!json.ok) throw new Error(json.error || "Gagal memproses permintaan.");

        hideStatus();
        
        if (json.type === "search") {
          if (json.data.length === 0) {
            showStatus("Aplikasi tidak ditemukan.", "info");
          } else {
            showStatus("Ditemukan " + json.data.length + " aplikasi.", "success");
            renderSearchResults(json.data);
          }
        } else {
          showStatus("Detail berhasil dimuat!", "success");
          renderDetail(json.data);
        }

      } catch (err) {
        if (err.name === "AbortError") {
          showStatus("Waktu habis. Server tidak merespons.", "error");
        } else {
          showStatus(err.message || "Terjadi kesalahan.", "error");
        }
      } finally {
        submit.disabled = false;
        input.disabled = false;
        spinner.hidden = true;
        label.textContent = mode === "search" ? "Cari" : "Lihat";
      }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initPstore);
  } else {
    initPstore();
  }
})();
</script>

</body>
</html>
